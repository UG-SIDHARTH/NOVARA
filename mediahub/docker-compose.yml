version: '3.8'

services:
  # Node.js backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novara-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./backend/downloads:/app/downloads
      - ./backend/cookies:/app/cookies
      - ./backend/history.json:/app/history.json
    environment:
      - NODE_ENV=production
      - PORT=5000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Vite frontend container (proxied by Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novara-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

